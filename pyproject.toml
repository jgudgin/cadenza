[project]
name = "cadenza"
version = "0.1.0"
description = "Dynamic, dependency-aware multi-agent orchestration engine, demonstrated on a financial-modelling workflow."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "anthropic>=0.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "typer>=0.12",
    "openpyxl>=3.1",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
cadenza = "cadenza.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cadenza*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
