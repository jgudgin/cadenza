[project]
name = "cadenza"
version = "0.1.0"
description = "Dynamic, dependency-aware multi-agent orchestration engine: agents complete tasks, a planner assesses the result and decides what happens next, all crash-safe in Postgres."
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic>=2.8",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
# LLM-backed planners (cadenza.llm) are optional - the engine itself has no
# opinion on what model, if any, makes planning decisions. A project that
# uses cadenza.llm.decide_next_steps needs this extra; one that only uses
# rule planners never touches Anthropic at all.
anthropic = ["anthropic>=1.0"]
# Includes the anthropic extra so CI actually imports and exercises
# cadenza.llm (tests/test_llm.py) instead of that module going untested.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "cadenza[anthropic]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["cadenza*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
