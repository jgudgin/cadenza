services:
  cadenza-db:
    image: postgres:16
    container_name: cadenza-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cadenza
      POSTGRES_DB: cadenza
    ports:
      - "5434:5432"
    volumes:
      - cadenza-db-data:/var/lib/postgresql/data

volumes:
  cadenza-db-data:
