services:
  cadenza-db:
    image: postgres:18
    container_name: cadenza-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: cadenza
      POSTGRES_DB: cadenza
    ports:
      - "5434:5432"
    volumes:
      # postgres:18+ moved the default data directory under the version-
      # specific /var/lib/postgresql (was .../data on 16/17).
      - cadenza-db-data:/var/lib/postgresql

volumes:
  cadenza-db-data:
