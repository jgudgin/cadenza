name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Real Postgres, not a mock - the whole point of this test suite is to
    # catch what only shows up against it (SKIP LOCKED, the dependency
    # NOT EXISTS check, the jsonb `||` merge under real concurrency).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: cadenza
          POSTGRES_DB: cadenza
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:cadenza@localhost:5432/cadenza

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install cadenza
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest -v
